<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hiperstructures makes precast concrete in Baripada, Odisha: U drains, box culverts, beams, slabs, compound walls, pavers, tiles, blocks and cover blocks." />
    <meta name="theme-color" content="#e4e3df" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Hiperstructures – Precast concrete from Baripada, Odisha</title>
    <script>
      // Apply the saved or OS theme before first paint to avoid a flash
      ;(function () {
        var saved = localStorage.getItem('theme')
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
